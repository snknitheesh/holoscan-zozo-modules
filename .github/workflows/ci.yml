# Five checks, each a stable name that branch protection requires:
#   Lint         GitHub-hosted: selects what to test (below), then prek, actionlint,
#                the CI driver's tests and the selected modules' and demos' SDK-free tests.
#   x86 GPU      Self-hosted x86_64 runner with an NVIDIA GPU (driver R595 or newer).
#   Jetson Thor  Self-hosted Jetson Thor (JetPack 7.2).
#   Jetson Orin  Self-hosted Jetson Orin (JetPack 7.2).
#   CI result    GitHub-hosted, always runs: fails unless every job above
#                succeeded, so a skipped GPU job (a fork's pull request) is not green.
# All GPU jobs build the one CI image, .github/docker/Dockerfile, for their own
# architecture, and run .github/scripts/ci.py in it, which discovers modules/*/ and
# applications/*/, so adding one needs no change here. Every CI container is labeled
# and removed however its job ends (.github/scripts/ci_container.py). Runner setup and the repository
# settings these jobs rely on are in .github/RUNNERS.md.
#
# What runs: a pull request tests the modules and demos it changes, what depends on
# them, and builds what they depend on (`ci.py select`); a change outside their
# folders tests everything. When it selects nothing to build, such as documentation
# only, the GPU jobs still report, from a GitHub-hosted runner, without touching a
# GPU. A push to main, a manual run and the nightly run test everything; the nightly
# run also sets HOLOSCAN_CI_NIGHTLY=1 for tests that need long runs or real models.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly: everything, on every lane, with HOLOSCAN_CI_NIGHTLY=1.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Test only what changed since this commit SHA or origin/<branch> (as for a
          pull request, from the merge base); empty tests everything
        type: string
        default: ""
      nightly:
        description: Run the nightly tests too (HOLOSCAN_CI_NIGHTLY=1); tests everything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The nightly run has a group of its own, so that it neither cancels nor is
  # cancelled by a push to main waiting in the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    # A fork that turns its scheduled workflows on has no GPU runners to run them.
    if: github.event_name != 'schedule' || github.repository == 'snknitheesh/holoscan-zozo-modules'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # What the GPU jobs test, as `ci.py select` printed it, and whether they need a GPU.
      selection: ${{ steps.select.outputs.selection }}
      gpu: ${{ steps.select.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Copyright years are checked against the pull request's base or the previous
          # push, and the selection against the pull request's base.
          fetch-depth: 0
          persist-credentials: false
      # A pull request compares with its base, from their merge base; a manual run with
      # its `base` input when given. Anything else tests everything.
      - name: Select what to test
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          args=()
          if [ -n "$BASE" ]; then
            args+=(--changed-since "$BASE")
          fi
          if [ "$NIGHTLY" = true ]; then
            args+=(--nightly)
          fi
          python3 .github/scripts/ci.py select "${args[@]}" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository tools
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.pre-commit-config.yaml', 'requirements.txt') }}
      - name: prek
        env:
          COPYRIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: prek run --all-files --show-diff-on-failure
      - name: Validate the workflows
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Test the CI driver
        run: python -m unittest discover -s .github/scripts -v
      - name: SDK-free tests
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
        run: python .github/scripts/ci.py host --selection "$SELECTION"

  x86-gpu:
    name: x86 GPU
    needs: lint
    # Self-hosted runners never run a fork's code on their own: a pull request from a
    # fork skips this job, and `CI result` then fails; see .github/RUNNERS.md.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # With nothing to build, the job only reports, from a GitHub-hosted runner: the
    # check must exist, and the GPU runner stays free.
    runs-on: ${{ needs.lint.outputs.gpu == 'true' && fromJSON('["self-hosted", "linux", "x64", "gpu"]') || 'ubuntu-24.04' }}
    # Also bounds a hung test: the container goes with the job.
    timeout-minutes: 180
    env:
      CI_IMAGE: holoscan-modules-ci:local
      CI_JOB_KEY: x86
      CI_CONTAINER: holoscan-modules-ci-${{ github.run_id }}-${{ github.run_attempt }}-x86
    steps:
      - name: Nothing to build
        if: needs.lint.outputs.gpu != 'true'
        run: echo "This change selects no module or demo to build; see the Lint job's selection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.lint.outputs.gpu == 'true'
        with:
          persist-credentials: false
      # The runner's job hook (.github/RUNNERS.md) does this too, before and after
      # every job; this covers a runner without it.
      - name: Remove left-over CI containers and images
        if: needs.lint.outputs.gpu == 'true'
        run: python3 .github/scripts/ci_container.py sweep
      - name: Build the CI image
        id: image
        if: needs.lint.outputs.gpu == 'true'
        run: |
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::Docker Buildx is not installed on this runner. Install it (Docker's packages: docker-buildx-plugin; Ubuntu's docker.io: sudo apt-get install docker-buildx); see .github/RUNNERS.md."
            exit 1
          fi
          # Up to three attempts: a network hiccup while pulling the base image or the
          # Dockerfile frontend should not fail the lane. A broken Dockerfile still fails.
          for attempt in 1 2 3; do
            if docker buildx build --load --force-rm --iidfile "$RUNNER_TEMP/ci-image-id" \
              -f .github/docker/Dockerfile -t "$CI_IMAGE" .github/docker; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::Building the CI image failed (attempt $attempt of 3); retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "id=$(cat "$RUNNER_TEMP/ci-image-id")" >> "$GITHUB_OUTPUT"
      # `exec`, so that cancelling the job signals ci_container.py, which removes
      # the container, rather than this step's shell.
      - name: Build, test, install and consume the selected modules; build and run the selected demos
        if: needs.lint.outputs.gpu == 'true'
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          SELECTION: ${{ needs.lint.outputs.selection }}
        run: >-
          exec python3 .github/scripts/ci_container.py run
          --image "$IMAGE_ID" --name "$CI_CONTAINER" --log "ci-x86_64.log"
          --docker-options "--gpus all"
          -- python3 .github/scripts/ci.py sdk --platform x86_64 --selection "$SELECTION"
      - name: Remove the container and stale images
        if: always() && needs.lint.outputs.gpu == 'true'
        run: python3 .github/scripts/ci_container.py sweep
      # The logs are for diagnosis only: failing to upload them must not fail a lane
      # whose build and tests passed.
      - name: Upload logs
        if: always() && needs.lint.outputs.gpu == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-x86_64
          path: |
            ci-x86_64.log
            build-ci/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  jetson:
    name: Jetson ${{ matrix.title }}
    needs: lint
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: thor
            title: Thor
          - board: orin
            title: Orin
    # With nothing to build, the job only reports, from a GitHub-hosted runner, as above.
    runs-on: ${{ needs.lint.outputs.gpu == 'true' && fromJSON(format('["self-hosted", "linux", "arm64", "jetson", "{0}"]', matrix.board)) || 'ubuntu-24.04' }}
    # Also bounds a hung test: the container goes with the job.
    timeout-minutes: 240
    env:
      CI_IMAGE: holoscan-modules-ci:local
      CI_JOB_KEY: ${{ matrix.board }}
      CI_CONTAINER: holoscan-modules-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.board }}
    steps:
      - name: Nothing to build
        if: needs.lint.outputs.gpu != 'true'
        run: echo "This change selects no module or demo to build; see the Lint job's selection."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.lint.outputs.gpu == 'true'
        with:
          persist-credentials: false
      # The runner's job hook (.github/RUNNERS.md) does this too, before and after
      # every job; this covers a runner without it.
      - name: Remove left-over CI containers and images
        if: needs.lint.outputs.gpu == 'true'
        run: python3 .github/scripts/ci_container.py sweep
      - name: Build the CI image
        id: image
        if: needs.lint.outputs.gpu == 'true'
        run: |
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::Docker Buildx is not installed on this runner. Install it (Docker's packages: docker-buildx-plugin; Ubuntu's docker.io: sudo apt-get install docker-buildx); see .github/RUNNERS.md."
            exit 1
          fi
          # Up to three attempts: a network hiccup while pulling the base image or the
          # Dockerfile frontend should not fail the lane. A broken Dockerfile still fails.
          for attempt in 1 2 3; do
            if docker buildx build --load --force-rm --iidfile "$RUNNER_TEMP/ci-image-id" \
              -f .github/docker/Dockerfile -t "$CI_IMAGE" .github/docker; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::Building the CI image failed (attempt $attempt of 3); retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "id=$(cat "$RUNNER_TEMP/ci-image-id")" >> "$GITHUB_OUTPUT"
      # The PVA and the integrated GPU need the NVIDIA runtime and a privileged
      # container. DISPLAY must stay unset: with it, VPI fails with EGL_NOT_INITIALIZED.
      # `exec`, so that cancelling the job signals ci_container.py, which removes
      # the container, rather than this step's shell.
      - name: Build, test, install and consume the selected modules; build and run the selected demos
        if: needs.lint.outputs.gpu == 'true'
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          SELECTION: ${{ needs.lint.outputs.selection }}
        run: >-
          exec python3 .github/scripts/ci_container.py run
          --image "$IMAGE_ID" --name "$CI_CONTAINER" --log "ci-jetson-${{ matrix.board }}.log"
          --docker-options "--runtime nvidia --privileged"
          -- python3 .github/scripts/ci.py sdk --platform jetson --selection "$SELECTION"
      - name: Remove the container and stale images
        if: always() && needs.lint.outputs.gpu == 'true'
        run: python3 .github/scripts/ci_container.py sweep
      # The logs are for diagnosis only: failing to upload them must not fail a lane
      # whose build and tests passed.
      - name: Upload logs
        if: always() && needs.lint.outputs.gpu == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-jetson-${{ matrix.board }}
          path: |
            ci-jetson-${{ matrix.board }}.log
            build-ci/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The one check that is never skipped. A skipped job counts as passing for branch
  # protection, and a skipped matrix job reports under its unexpanded name, so this
  # job turns a skipped or failed lane into a visible failure.
  result:
    name: CI result
    needs: [lint, x86-gpu, jetson]
    if: always() && (github.event_name != 'schedule' || github.repository == 'snknitheesh/holoscan-zozo-modules')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          failed=0
          if [ "$FORK" = true ]; then
            echo "::error::This pull request is from a fork, so the GPU jobs did not run. A maintainer must review it and push the branch to this repository to run them; see .github/RUNNERS.md."
            failed=1
          fi
          # A jq failure ends the step here, under the default `bash -e`.
          results="$(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")"
          if [ -z "$results" ]; then
            echo "::error::No job results to check"
            exit 1
          fi
          while IFS=$'\t' read -r job result; do
            echo "$job: $result"
            if [ "$result" != success ]; then
              echo "::error::Job $job did not succeed: $result"
              failed=1
            fi
          done <<< "$results"
          exit "$failed"
