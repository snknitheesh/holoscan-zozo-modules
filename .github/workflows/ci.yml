# Three jobs, each a stable check name for branch protection:
#   Lint     GitHub-hosted: pre-commit, actionlint, the CI driver's tests and the
#            SDK-free tests of every module and demo.
#   x86 GPU  Self-hosted x86_64 runner with an NVIDIA GPU.
#   Jetson   Self-hosted Jetson Thor and Jetson Orin (JetPack 7).
# All GPU jobs build the one CI image, .github/docker/Dockerfile, for their own
# architecture, and run .github/scripts/ci.py in it, which discovers modules/*/ and
# applications/*/, so adding one needs no change here. Every CI container is labeled
# and removed however its job ends (.github/scripts/ci_container.py). Runner setup and the repository
# settings these jobs rely on are in .github/RUNNERS.md.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Copyright years are checked against the pull request's base or the previous push.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository tools
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        env:
          COPYRIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate the workflows
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Test the CI driver
        run: python -m unittest discover -s .github/scripts -v
      - name: SDK-free tests
        run: python .github/scripts/ci.py host

  x86-gpu:
    name: x86 GPU
    needs: lint
    # Self-hosted runners never run a fork's code on their own: a pull request from a
    # fork skips this job; see .github/RUNNERS.md.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, gpu]
    # Also bounds a hung test: the container goes with the job.
    timeout-minutes: 180
    env:
      CI_IMAGE: holoscan-modules-ci:local
      CI_JOB_KEY: x86
      CI_CONTAINER: holoscan-modules-ci-${{ github.run_id }}-${{ github.run_attempt }}-x86
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The runner's job hook (.github/RUNNERS.md) does this too, before and after
      # every job; this covers a runner without it.
      - name: Remove left-over CI containers and images
        run: python3 .github/scripts/ci_container.py sweep
      - name: Build the CI image
        id: image
        run: |
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::Docker Buildx is not installed on this runner. Install it (Docker's packages: docker-buildx-plugin; Ubuntu's docker.io: sudo apt-get install docker-buildx); see .github/RUNNERS.md."
            exit 1
          fi
          docker buildx build --load --iidfile "$RUNNER_TEMP/ci-image-id" \
            -f .github/docker/Dockerfile -t "$CI_IMAGE" .github/docker
          echo "id=$(cat "$RUNNER_TEMP/ci-image-id")" >> "$GITHUB_OUTPUT"
      # `exec`, so that cancelling the job signals ci_container.py, which removes
      # the container, rather than this step's shell.
      - name: Build, test, install and consume every module; build and run every demo
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: >-
          exec python3 .github/scripts/ci_container.py run
          --image "$IMAGE_ID" --name "$CI_CONTAINER" --log "ci-x86_64.log"
          --docker-options "--gpus all"
          -- python3 .github/scripts/ci.py sdk --platform x86_64
      - name: Remove the container and stale images
        if: always()
        run: python3 .github/scripts/ci_container.py sweep
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-x86_64
          path: |
            ci-x86_64.log
            build-ci/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  jetson:
    name: Jetson ${{ matrix.title }}
    needs: lint
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: thor
            title: Thor
          - board: orin
            title: Orin
    runs-on: [self-hosted, linux, arm64, jetson, "${{ matrix.board }}"]
    # Also bounds a hung test: the container goes with the job.
    timeout-minutes: 240
    env:
      CI_IMAGE: holoscan-modules-ci:local
      CI_JOB_KEY: ${{ matrix.board }}
      CI_CONTAINER: holoscan-modules-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.board }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The runner's job hook (.github/RUNNERS.md) does this too, before and after
      # every job; this covers a runner without it.
      - name: Remove left-over CI containers and images
        run: python3 .github/scripts/ci_container.py sweep
      - name: Build the CI image
        id: image
        run: |
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::Docker Buildx is not installed on this runner. Install it (Docker's packages: docker-buildx-plugin; Ubuntu's docker.io: sudo apt-get install docker-buildx); see .github/RUNNERS.md."
            exit 1
          fi
          docker buildx build --load --iidfile "$RUNNER_TEMP/ci-image-id" \
            -f .github/docker/Dockerfile -t "$CI_IMAGE" .github/docker
          echo "id=$(cat "$RUNNER_TEMP/ci-image-id")" >> "$GITHUB_OUTPUT"
      # The PVA and the integrated GPU need the NVIDIA runtime and a privileged
      # container. DISPLAY must stay unset: with it, VPI fails with EGL_NOT_INITIALIZED.
      # `exec`, so that cancelling the job signals ci_container.py, which removes
      # the container, rather than this step's shell.
      - name: Build, test, install and consume every module; build and run every demo
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: >-
          exec python3 .github/scripts/ci_container.py run
          --image "$IMAGE_ID" --name "$CI_CONTAINER" --log "ci-jetson-${{ matrix.board }}.log"
          --docker-options "--runtime nvidia --privileged"
          -- python3 .github/scripts/ci.py sdk --platform jetson
      - name: Remove the container and stale images
        if: always()
        run: python3 .github/scripts/ci_container.py sweep
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-jetson-${{ matrix.board }}
          path: |
            ci-jetson-${{ matrix.board }}.log
            build-ci/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7
