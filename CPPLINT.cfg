# Do not inherit lint policy from unrelated parent checkouts.
set noparent

# Google-internal header bans, not general best practice: cpplint flags <cfenv>,
# <ratio>, <thread>, <chrono> and <filesystem>, which this C++20 code uses freely.
filter=-build/c++11,-build/c++17

# Non-const reference parameters are allowed by the Google style guide and are
# required by SDK APIs.
filter=-runtime/references

# Module-private headers are included relative to the including file.
# Include ordering IS enforced: .clang-format's IncludeCategories match cpplint's
# build/include_order grouping.
filter=-build/include_subdir

exclude_files=^(\.cache|\.venv|__pycache__|build(-.*)?|install(-.*)?|Testing)$
linelength=100
