# Run with prek (https://prek.j178.dev), as CI does, or with pre-commit: both read this
# file. Install once with `prek install`; lint everything with `prek run --all-files`.
# Both see tracked files only. prek ignores minimum_pre_commit_version; CI pins prek in
# requirements.txt instead.
minimum_pre_commit_version: "4.6.2"
default_stages: [pre-commit]
exclude: >-
  (?x)(
    ^(build[^/]*|install[^/]*|Testing|\.cache|\.venv)/
    |(^|/)__pycache__/
  )

# Immutable revisions with readable release labels.
# Refresh with: prek autoupdate --freeze (or pre-commit autoupdate --freeze)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: pretty-format-json
        args: [--autofix, --indent, "2", --no-sort-keys]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c  # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
        args: [--style=file, --fallback-style=none]

  - repo: https://github.com/cpplint/cpplint
    rev: 350702a4d39395571bd118c9a3cff0a573488d61  # frozen: 2.0.2
    hooks:
      - id: cpplint
        args: [--quiet]
        types_or: [c, c++, cuda]

  # gersemi formats CMake (indentation included, configured in .gersemirc); cmakelint
  # checks what a formatter cannot, so it leaves indentation (and line length) to gersemi.
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 28010ddd6016e1a0f7bd232acb6536ef996ae897  # frozen: 0.29.2
    hooks:
      - id: gersemi

  - repo: https://github.com/cmake-lint/cmake-lint
    rev: 7c644095eb566fa805839ad53b733f7bcdb73032  # frozen: 1.4.3
    hooks:
      - id: cmakelint
        args:
          - --filter=-whitespace/indent,-linelength,-readability/wonkycase,-convention/filename,-package/stdargs

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Prebuilt upstream shfmt; 2-space indent, matching the rest of the repository.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent=2, --case-indent, --space-redirects]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
        language_version: "24.21.0"
        args: [--fix, --no-globs]

  - repo: local
    hooks:
      - id: spdx-copyright
        name: check SPDX license and copyright
        entry: python3 .github/scripts/check_copyright.py
        language: python
        files: >-
          (?x)(
            (^|/)(CMakeLists\.txt|Dockerfile|CPPLINT\.cfg|requirements\.in)$
            |\.(c|cc|cpp|cu|cuh|h|hpp|py|cmake|fbs|Dockerfile|sh)$
            |^\.github/.*\.ya?ml$
            |^\.(clang-format|gersemirc|hadolint\.yaml|markdownlint-cli2\.yaml|pre-commit-config\.yaml|yamllint)$
            |(^|/)pyproject\.toml$
          )
        types: [text]

      - id: holoscan-metadata
        name: validate Holoscan metadata
        entry: python3 .github/scripts/validate_metadata.py
        # Uses the CLI and jsonschema installed from requirements.txt.
        language: system
        files: '(^|/)metadata\.json$'
        types: [json]
